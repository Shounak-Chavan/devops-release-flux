version: '3.9'

services:

  backend:
    build: ./backend
    container_name: featureflow-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: featureflow-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always