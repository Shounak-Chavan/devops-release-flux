name: FeatureFlow CI/CD

on:
  push:
    branches: [ex-main]
  pull_request:
    branches: [ex-main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend deps
        working-directory: ./backend
        run: npm ci

      - name: Backend sanity
        working-directory: ./backend
        run: node -e "console.log('Backend OK')"

      - name: Frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Frontend build
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  docker:
    runs-on: ubuntu-latest
    needs: build-check
    if: github.ref == 'refs/heads/ex-main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/featureflow-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/featureflow-backend:${{ github.sha }}

      - name: Trigger Render Deploy
        run: |
          curl --fail -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}